name: Android toolchain
description: Set up the JDK, Gradle cache and Android SDK used by the remapper.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools'
    - uses: gradle/actions/setup-gradle@v4
    - name: Install project SDK
      shell: bash
      run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
